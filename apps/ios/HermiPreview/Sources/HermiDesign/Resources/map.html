window.commandHermi=c=>{
 if(!map)return;

 else if(c.action==='out')map.zoomOut({duration:0});
 else if(c.action==='drop'){
  if(!loaded||!Number.isFinite(c.x)||!Number.isFinite(c.y)||c.x<0||c.x>1||c.y<0||c.y>1){send({type:'dropRejected',requestID:c.id});return}
  const canvas=map.getCanvas();
  const p=map.unproject([c.x*canvas.clientWidth,c.y*canvas.clientHeight]);
  send({type:'drop',requestID:c.id,latitude:p.lat,longitude:p.lng});
 }
};
