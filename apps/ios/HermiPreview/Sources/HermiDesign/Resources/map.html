   el.style.width=width+'px';el.style.height=height+'px';
   const bounds={left:point.x-48,right:point.x+48,top:point.y-height-5,bottom:point.y+18};
   const onscreen=bounds.right>0&&bounds.left<container.clientWidth&&bounds.bottom>0&&bounds.top<container.clientHeight;
   const overlaps=occupied.some(b=>bounds.left<b.right&&bounds.right>b.left&&bounds.top<b.bottom&&bounds.bottom>b.top);
   const visible=onscreen&&!overlaps;
   el.style.display=visible?'block':'none';if(visible)occupied.push(bounds);
  }
 };
 map.on('zoom',updateLandmarks);updateLandmarks();
}

// Place dots are one WebGL symbol layer (thousands of points); each colour gets a pixel image with an ink edge.
const DOT=['.IIII.','IccccI','IccccI','IccccI','IccccI','.IIII.'];
function rgb(hex){const n=parseInt(String(hex).slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function ensureDot(color){
 const id='dot-'+color;if(map.hasImage(id))return id;
 const size=DOT.length,data=new Uint8Array(size*size*4),c=rgb(color),ink=rgb(palette.ink);
 DOT.forEach((row,y)=>[...row].forEach((px,x)=>{if(px==='.')return;const v=px==='I'?ink:c,i=(y*size+x)*4;data[i]=v[0];data[i+1]=v[1];data[i+2]=v[2];data[i+3]=255}));
 map.addImage(id,{width:size,height:size,data},{pixelRatio:0.5});return id;
}
function placeAt(point){
 const r=16,found=map.queryRenderedFeatures([[point.x-r,point.y-r],[point.x+r,point.y+r]],{layers:['places']})||[];
 let best=null,bestD=Infinity;
 for(const f of found){const c=f.geometry.coordinates,p=map.project({lng:c[0],lat:c[1]}),d=Math.hypot(p.x-point.x,p.y-point.y);if(d<bestD){bestD=d;best=f.properties.id}}
 return best;
}
// Profile Adventures: explored zoom-18 tiles as pixel squares; the camera fits them once per set.
let exploredSignature='';
function tilePolygon(x,y){const n=2**18,lng=v=>v/n*360-180,lat=v=>Math.atan(Math.sinh(Math.PI*(1-2*v/n)))*180/Math.PI;
 return [[lng(x),lat(y)],[lng(x+1),lat(y)],[lng(x+1),lat(y+1)],[lng(x),lat(y+1)],[lng(x),lat(y)]]}
function renderExplored(tiles){
 const signature=JSON.stringify(tiles);
 if(signature===exploredSignature)return;
 exploredSignature=signature;
 if(!tiles){map.getSource('explored').setData(empty);return}
 const rings=tiles.map(t=>tilePolygon(t[0],t[1]));
 map.getSource('explored').setData({type:'FeatureCollection',features:rings.map(r=>({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[r]}}))});
 const all=rings.flat(),bounds=all.reduce((b,c)=>b.extend(c),new maplibregl.LngLatBounds(all[0],all[0]));
 map.fitBounds(bounds,{padding:60,maxZoom:16,duration:0});
}
// Feed plan/adventure: numbered stops on the route; the camera fits the route once per route.
let routeSignature='',routeMarkers=[];
function renderRoute(route){
 const signature=JSON.stringify(route);
 if(signature===routeSignature)return;
 routeSignature=signature;routeMarkers.forEach(m=>m.remove());routeMarkers=[];
 if(!route)return;
 for(const stop of route.stops||[]){
  const el=document.createElement('div');el.className='route-stop';el.textContent=String(stop.index);el.style.background=stop.color;
  routeMarkers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([stop.lng,stop.lat]).addTo(map));
 }
 const bounds=route.line.reduce((b,c)=>b.extend(c),new maplibregl.LngLatBounds(route.line[0],route.line[0]));
 map.fitBounds(bounds,{padding:{top:140,bottom:320,left:60,right:60},maxZoom:16,duration:0});
}
// Visible area for place queries: bounds [west,south,east,north], zoom.
function viewport(){const b=map.getBounds();return {bounds:[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()],zoom:map.getZoom()}}
function pin(color, name, rows){
 const button=document.createElement('button');button.className='pin';button.setAttribute('aria-label',name);
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${rows[0].length} ${rows.length}`);svg.setAttribute('shape-rendering','crispEdges');
 rows.forEach((row,y)=>[...row].forEach((pixel,x)=>{if(pixel===' ')return;const rect=document.createElementNS(svg.namespaceURI,'rect');for(const [k,v]of Object.entries({x,y,width:1,height:1,fill:pixel==='I'?palette.ink:pixel==='H'?palette.paper:color}))rect.setAttribute(k,v);svg.append(rect)}));button.append(svg);
 return button;
}

const editor=document.getElementById('pin-editor'), radius=document.getElementById('pin-radius'), radiusValue=document.getElementById('radius-value');
const removeButton=document.getElementById('pin-remove');
function positionEditor(){
 const selected=pending.editingDiscovery&&pending.discovery&&discoveryMarker;
 editor.style.display=selected?'block':'none';removeButton.style.display=selected?'block':'none';
 if(!selected)return;
 const p=map.project(discoveryMarker.getLngLat());
 const height=map.getContainer().clientHeight, inset=pending.bottomInset||110;
 editor.style.bottom=(inset+132+4)+'px';
 radius.style.height=Math.max(44,Math.min(100,height-inset-132-260))+'px';
 removeButton.style.left=(p.x-1)+'px';removeButton.style.top=(p.y-64)+'px';
}
function radiusFeature(p){
 if(!p)return empty;
 const coords=[], distance=p.radiusMiles*1609.344/6371008.8, lat=p.lat*Math.PI/180, lng=p.lng*Math.PI/180;
 for(let i=0;i<=72;i++){
  const bearing=i*2*Math.PI/72;
  const phi=Math.asin(Math.sin(lat)*Math.cos(distance)+Math.cos(lat)*Math.sin(distance)*Math.cos(bearing));
  const lambda=lng+Math.atan2(Math.sin(bearing)*Math.sin(distance)*Math.cos(lat),Math.cos(distance)-Math.sin(lat)*Math.sin(phi));
  coords.push([lambda*180/Math.PI,phi*180/Math.PI]);
 }
 return {type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[coords]}}]};
}
function updateRadius(){
 if(!pending.discovery)return;
 const miles=0.1*Math.pow(40,Number(radius.value));
 radiusValue.textContent=Number(miles.toPrecision(2))+' mi';
 radius.setAttribute('aria-valuetext',radiusValue.textContent);
 map.getSource('discovery-radius').setData(radiusFeature({...pending.discovery,radiusMiles:miles}));
 send({type:'pinRadius',id:pending.discovery.id,miles});
}
radius.addEventListener('input',updateRadius);
for(const event of ['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend'])editor.addEventListener(event,e=>e.stopPropagation());
removeButton.onclick=e=>{e.stopPropagation();if(pending.discovery)send({type:'pinRemove',id:pending.discovery.id})};
for(const event of ['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend'])removeButton.addEventListener(event,e=>e.stopPropagation());
function discoveryPins(){return pending.discoveries|| (pending.discovery?[pending.discovery]:[])}
function currentPin(id){return discoveryPins().find(p=>p.id===id)}
function renderDiscovery(){
 const pins=discoveryPins(), ids=new Set(pins.map(p=>p.id));
 if(lastBottomInset!==pending.bottomInset){lastBottomInset=pending.bottomInset;revealDiscovery=true}
 for(const [id,marker]of discoveryMarkers)if(!ids.has(id)){marker.remove();discoveryMarkers.delete(id)}
 for(const p of pins){
  let marker=discoveryMarkers.get(p.id);
  if(!marker){
   const el=pin(p.color,p.category+' discovery pin. Drag to move; tap to edit radius.',p.rows);
   el.onclick=e=>{e.stopPropagation();send({type:'discovery',id:p.id})};
   marker=new maplibregl.Marker({element:el,anchor:'bottom',draggable:true}).setLngLat([p.lng,p.lat]).addTo(map);
   marker.pinID=p.id;marker.isDragging=false;discoveryMarkers.set(p.id,marker);revealDiscovery=true;
   const cancelDrag=()=>{
    const original=currentPin(p.id);if(!marker.isDragging||!original)return;
    marker.isDragging=false;draggingPin=false;marker.setLngLat([original.lng,original.lat]);
    map.getSource('discovery-radius').setData(pending.editingDiscovery?radiusFeature(pending.discovery):empty);positionEditor();
    send({type:'pinDragCancelled',id:p.id});
   };
   el.addEventListener('pointercancel',cancelDrag);el.addEventListener('touchcancel',cancelDrag);
   marker.on('dragstart',()=>{marker.isDragging=true;draggingPin=true;send({type:'pinDragStart',id:p.id})});
   marker.on('drag',()=>{const original=currentPin(p.id);if(!original)return;const c=marker.getLngLat();map.getSource('discovery-radius').setData(radiusFeature({...original,lng:c.lng,lat:c.lat}));positionEditor()});
   marker.on('dragend',()=>{if(!marker.isDragging)return;marker.isDragging=false;draggingPin=false;revealDiscovery=true;const c=marker.getLngLat();send({type:'pinMove',id:p.id,latitude:c.lat,longitude:c.lng})});
  }
  if(!marker.isDragging)marker.setLngLat([p.lng,p.lat]);
 }
 const p=pending.editingDiscovery?pending.discovery:null;
 discoveryMarker=p?discoveryMarkers.get(p.id):null;
 if(!p||!discoveryMarker){editor.style.display='none';removeButton.style.display='none';map.getSource('discovery-radius').setData(empty);return}
 if(revealDiscovery&&!draggingPin){
  revealDiscovery=false;
  const screen=map.project(discoveryMarker.getLngLat()), usableBottom=map.getContainer().clientHeight-(pending.bottomInset||110)-44;
  if(screen.y>usableBottom||screen.y<120)map.panBy([0,screen.y-(120+usableBottom)/2],{duration:0});
 }
 // Always sync when selection changes, even while the range has keyboard focus.
 if(radius.pinID!==p.id||document.activeElement!==radius)radius.value=Math.log(p.radiusMiles/0.1)/Math.log(40);
 radius.pinID=p.id;radiusValue.textContent=Number(p.radiusMiles.toPrecision(2))+' mi';radius.setAttribute('aria-valuetext',radiusValue.textContent);
 map.getSource('discovery-radius').setData(radiusFeature(p));positionEditor();
}
window.renderHermi=data=>{pending=data;if(!loaded)return;
 document.documentElement.className=data.reduceMotion?'reduce-motion':'';
 map.getSource('social-routes').setData({type:'FeatureCollection',features:data.social?(data.socialRoutes||[]):[]});
 const places=data.places||[], placeSig=JSON.stringify(places);
 if(placeSig!==placeSignature){
  placeSignature=placeSig;
  map.getSource('places').setData({type:'FeatureCollection',features:places.map(p=>({type:'Feature',properties:{id:p.id,name:p.name,icon:ensureDot(p.color)},geometry:{type:'Point',coordinates:[p.lng,p.lat]}}))});
 }
 const signature=JSON.stringify([data.social,data.socialMarkers]);
 if(signature!==socialSignature){
  socialSignature=signature;markers.forEach(m=>m.remove());markers=[];
  if(data.social){for(const item of data.socialMarkers||[]){
   const el=document.createElement('button');el.className='friend '+item.kind;el.setAttribute('aria-label',item.name);
   const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 16 16');svg.setAttribute('aria-hidden','true');
   const draw=(d,fill,transform)=>{const path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('d',d);path.setAttribute('fill',fill);if(transform)path.setAttribute('transform',transform);svg.append(path)};
   if(item.kind==='current'||item.kind==='recent'){
    const circle='M5 0h6v1h2v2h2v2h1v6h-1v2h-2v2h-2v1H5v-1H3v-2H1v-2H0V5h1V3h2V1h2z';
    draw(circle,palette.ink);
    draw(circle,palette.green,'translate(1 1) scale(.875)');
    // Two heads and shoulders only: readable at small map scale.
    draw('M4 4h2v3H4zM10 4h2v3H10zM4 8h2v1h1v3H3V9h1zM10 8h2v1h1v3H9V9h1z',palette.paper);
   }else if(item.kind==='quest'){
    // Open plan from a matched student: the "!" quest-giver marker.
    draw('M3 0h10v1h2v12h-2v1H9v2H7v-2H3v-1H1V1h2z',palette.ink);
    draw('M4 1h8v1h2v10h-2v1H4v-1H2V2h2z',palette.lavender||'#A596DD');
    draw('M7 3h2v6H7zM7 10h2v2H7z',palette.ink);
   }else{
    draw('M2 2h4v2h4V2h4v2h2v6h-2v2h-2v2h-2v2H6v-2H4v-2H2v-2H0V4h2z','#D66C9B');
   }
   el.append(svg);el.onclick=e=>{e.stopPropagation();send({type:'socialInfo',id:item.id})};
   markers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([item.lng,item.lat]).addTo(map));
  }}
 }
 renderDiscovery();
 const coords=[[-73.9699,40.8067],[-73.9682,40.8074],[-73.9655,40.8085],[-73.9641,40.8066],[-73.9624,40.8073]];
 const route=data.route&&data.route.line&&data.route.line.length?data.route:null;
 const explored=data.adventure&&data.tiles&&data.tiles.length?data.tiles:null;
 renderExplored(explored);
 const line=data.adventure&&!explored?coords:route&&route.line.length>1?route.line:null;
 map.getSource('adventure').setData(line?{type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:line}}]}:empty);
 renderRoute(route);
 document.querySelector('.notice').textContent=data.adventure?(explored?`EXPLORED · ${explored.length} TILES`:'SAMPLE ROUTE · NOT RECORDED GPS'):data.social?(data.socialLabel||'SAMPLE SOCIAL · NOT LIVE'):'';
 document.querySelector('.notice').style.display=data.adventure||data.social?'block':'none';
};
window.commandHermi=c=>{
 if(!map)return;
 if(c.action==='recenter')map.jumpTo({center:[-73.965,40.8075],zoom:15.1});
 else if(c.action==='in')map.zoomIn({duration:0});
 else if(c.action==='out')map.zoomOut({duration:0});
 else if(c.action==='drop'){
  if(!loaded||!Number.isFinite(c.x)||!Number.isFinite(c.y)||c.x<0||c.x>1||c.y<0||c.y>1){send({type:'dropRejected',requestID:c.id});return}
  const canvas=map.getCanvas();
  const p=map.unproject([c.x*canvas.clientWidth,c.y*canvas.clientHeight]);
  send({type:'drop',requestID:c.id,latitude:p.lat,longitude:p.lng});
 }
};
</script></body></html>
