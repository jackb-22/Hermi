<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="maplibre-gl.css">
<script>
const palette=window.hermiPalette;
for(const [name,color] of Object.entries(palette))document.documentElement.style.setProperty('--'+name,color);
</script><style>
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:var(--lake)}canvas{image-rendering:pixelated}.maplibregl-ctrl-attrib{font:8px system-ui;background:color-mix(in srgb,var(--paper) 80%,transparent)!important}.maplibregl-ctrl-bottom-right{bottom:110px;right:4px}.pin{border:0;padding:0;background:none;width:44px;height:52px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}.pin svg{width:33px;height:42px;overflow:visible;image-rendering:pixelated}.friend{border:3px solid var(--ink);background:var(--coral);width:24px;height:24px;box-shadow:3px 3px var(--paper);font:12px monospace;color:var(--ink)}.notice{position:absolute;bottom:92px;left:10px;font:9px monospace;color:var(--ink);background:color-mix(in srgb,var(--paper) 86%,transparent);padding:3px;pointer-events:none}#error{display:none;position:absolute;top:45%;left:16px;right:85px;padding:16px;background:var(--paper);font:13px system-ui;color:var(--ink);box-shadow:4px 4px var(--ink)}#error button{padding:10px;margin-top:8px;background:var(--lime);border:0;display:block}a{color:var(--ink)}
#control-tip{display:none;position:absolute;bottom:185px;left:12px;right:12px;background:var(--paper);color:var(--ink);font:13px system-ui;padding:12px;pointer-events:none;box-shadow:3px 3px var(--ink)}

#pin-editor{display:none;position:absolute;z-index:3;width:68px;background:var(--paper);color:var(--ink);box-shadow:3px 3px var(--ink);padding:8px;font:12px system-ui;text-align:center;touch-action:none}
#pin-editor button{display:block;margin-left:auto;width:44px;height:44px;padding:12px;border:0;background:var(--paper);color:var(--ink);cursor:pointer}
#pin-editor button svg{width:20px;height:20px;shape-rendering:crispEdges}
#pin-editor input{writing-mode:vertical-lr;direction:rtl;display:block;width:44px;height:140px;margin:4px auto;accent-color:var(--green);touch-action:none}
#pin-editor input{-webkit-appearance:none;appearance:none;background:transparent;border:0;border-radius:0}
#pin-editor input::-webkit-slider-runnable-track{width:6px;background:var(--green);border-radius:0}
#pin-editor input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:16px;background:var(--lime);border:3px solid var(--ink);border-radius:0;margin-left:-9px}
#pin-editor output{display:block;font-weight:600;padding:5px 0}
</style></head><body><div id="map"></div><div id="pin-editor"><button id="pin-remove" aria-label="Remove discovery pin"><svg viewBox="0 0 9 9" aria-hidden="true"><path fill="currentColor" d="M0 0h2v1h1v1h1v1h1V2h1V1h1V0h2v2H8v1H7v1H6v1h1v1h1v1h1v2H7V8H6V7H5V6H4v1H3v1H2v1H0V7h1V6h1V5h1V4H2V3H1V2H0z"/></svg></button><input id="pin-radius" aria-label="Geographic radius in miles" type="range" min="0" max="1" step="0.01" value="0.5"><output id="radius-value">1 mi</output></div><div id="control-tip" role="status"></div><div class="notice">SAMPLE PLACES · REAL MAP</div><div id="error">Map unavailable. Check your connection.<button onclick="location.reload()">Retry map</button></div><script src="maplibre-gl.js"></script><script>
const send=body=>window.webkit?.messageHandlers.hermi.postMessage(body);
let map, pending={},markers=[],loaded=false,placeSignature="",discoveryMarker=null,draggingPin=false,revealDiscovery=false;
const empty={type:'FeatureCollection',features:[]};
const error=document.getElementById('error');
try {
map=new maplibregl.Map({container:'map',center:[-73.965,40.8075],zoom:15.1,minZoom:1,maxZoom:19,pixelRatio:0.5,attributionControl:false,dragRotate:false,pitchWithRotate:false,style:{version:8,sources:{world:{type:'vector',url:'https://tiles.openfreemap.org/planet'}},layers:[
{id:'land',type:'background',paint:{'background-color':palette.land}},
{id:'cover',type:'fill',source:'world','source-layer':'landcover',paint:{'fill-color':palette.cover,'fill-antialias':false}},
{id:'parks',type:'fill',source:'world','source-layer':'landuse',filter:['in','class','park','grass','wood','recreation_ground','cemetery'],paint:{'fill-color':palette.parks,'fill-antialias':false}},
{id:'water',type:'fill',source:'world','source-layer':'water',paint:{'fill-color':palette.lake,'fill-antialias':false}},
{id:'buildings',type:'fill',source:'world','source-layer':'building',minzoom:13,paint:{'fill-color':palette.buildings,'fill-antialias':false}},
{id:'roads',type:'line',source:'world','source-layer':'transportation',filter:['!=','class','rail'],paint:{'line-color':palette.paper,'line-width':['interpolate',['linear'],['zoom'],8,0.5,13,1.5,17,7,19,14]}},
{id:'paths',type:'line',source:'world','source-layer':'transportation',filter:['==','class','path'],minzoom:14,paint:{'line-color':palette.paths,'line-width':1,'line-dasharray':[2,2]}}
]}});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
map.on('load',()=>{loaded=true;error.style.display='none';map.addSource('adventure',{type:'geojson',data:empty});map.addLayer({id:'adventure',type:'line',source:'adventure',paint:{'line-color':palette.green,'line-width':4,'line-dasharray':[2,1]}});map.addSource('discovery-radius',{type:'geojson',data:empty});map.addLayer({id:'discovery-radius-fill',type:'fill',source:'discovery-radius',paint:{'fill-color':palette.lime,'fill-opacity':0.13}});map.addLayer({id:'discovery-radius-line',type:'line',source:'discovery-radius',paint:{'line-color':palette.green,'line-width':2,'line-dasharray':[3,2]}});renderHermi(pending);send({type:'ready'})});
map.on('error',()=>{error.style.display='block';send({type:'error'})});
map.on('idle',()=>{if(map.areTilesLoaded()){error.style.display='none';send({type:'ready'})}});
map.on('move',()=>positionEditor());
map.on('movestart',()=>send({type:'moving'}));map.on('moveend',()=>send({type:'stopped'}));
window.addEventListener('resize',()=>map.resize());
}catch(e){error.style.display='block';send({type:'error'})}
function pin(color, name, rows){
 const button=document.createElement('button');button.className='pin';button.setAttribute('aria-label',name);
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${rows[0].length} ${rows.length}`);svg.setAttribute('shape-rendering','crispEdges');
 rows.forEach((row,y)=>[...row].forEach((pixel,x)=>{if(pixel===' ')return;const rect=document.createElementNS(svg.namespaceURI,'rect');for(const [k,v]of Object.entries({x,y,width:1,height:1,fill:pixel==='I'?palette.ink:pixel==='H'?palette.paper:color}))rect.setAttribute(k,v);svg.append(rect)}));button.append(svg);
 let timer, origin, held=false;
 button.title=name+' · tap to open';
 button.addEventListener('pointerdown',e=>{origin=[e.clientX,e.clientY];held=false;timer=setTimeout(()=>{held=true;const tip=document.getElementById('control-tip');tip.textContent=name+' · tap to open details';tip.style.display='block';setTimeout(()=>tip.style.display='none',2400)},600)});
 button.addEventListener('pointermove',e=>{if(origin&&Math.hypot(e.clientX-origin[0],e.clientY-origin[1])>12)clearTimeout(timer)});
 for(const event of ['pointerup','pointercancel','pointerleave'])button.addEventListener(event,()=>clearTimeout(timer));
 button.addEventListener('click',e=>{if(held){e.preventDefault();e.stopImmediatePropagation();held=false}},true);
 return button;
}

const editor=document.getElementById('pin-editor'), radius=document.getElementById('pin-radius'), radiusValue=document.getElementById('radius-value');
function positionEditor(){
 if(!pending.editingDiscovery||!pending.discovery||!discoveryMarker){editor.style.display='none';return}
 const p=map.project(discoveryMarker.getLngLat());
 const width=map.getContainer().clientWidth, height=map.getContainer().clientHeight;
 if(p.x<0||p.x>width||p.y<0||p.y>height){editor.style.display='none';return}
 editor.style.display='block';
 editor.style.left=Math.max(12,Math.min(width-170,p.x-105))+'px';
 editor.style.top=Math.max(90,Math.min(height-(pending.bottomInset||110)-245,p.y-160))+'px';
}
function radiusFeature(p){
 if(!p)return empty;
 const coords=[], distance=p.radiusMiles*1609.344/6371008.8, lat=p.lat*Math.PI/180, lng=p.lng*Math.PI/180;
 for(let i=0;i<=72;i++){
  const bearing=i*2*Math.PI/72;
  const phi=Math.asin(Math.sin(lat)*Math.cos(distance)+Math.cos(lat)*Math.sin(distance)*Math.cos(bearing));
  const lambda=lng+Math.atan2(Math.sin(bearing)*Math.sin(distance)*Math.cos(lat),Math.cos(distance)-Math.sin(lat)*Math.sin(phi));
  coords.push([lambda*180/Math.PI,phi*180/Math.PI]);
 }
 return {type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[coords]}}]};
}
function updateRadius(){
 if(!pending.discovery)return;
 const miles=0.25*Math.pow(16,Number(radius.value));
 radiusValue.textContent=Number(miles.toPrecision(2))+' mi';
 radius.setAttribute('aria-valuetext',radiusValue.textContent);
 map.getSource('discovery-radius').setData(radiusFeature({...pending.discovery,radiusMiles:miles}));
 send({type:'pinRadius',id:pending.discovery.id,miles});
}
radius.addEventListener('input',updateRadius);
for(const event of ['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend'])editor.addEventListener(event,e=>e.stopPropagation());
document.getElementById('pin-remove').onclick=()=>{if(pending.discovery)send({type:'pinRemove',id:pending.discovery.id})};
function renderDiscovery(){
 const p=pending.discovery;
 if(!p){discoveryMarker?.remove();discoveryMarker=null;editor.style.display='none';map.getSource('discovery-radius').setData(empty);return}
 if(discoveryMarker?.pinID!==p.id){
  discoveryMarker?.remove();
  const el=pin(p.color,p.category+' discovery pin. Drag to move; tap to edit radius.',p.rows);
  el.onclick=e=>{e.stopPropagation();send({type:'discovery',id:p.id})};
  discoveryMarker=new maplibregl.Marker({element:el,anchor:'bottom',draggable:true}).setLngLat([p.lng,p.lat]).addTo(map);
  discoveryMarker.pinID=p.id;revealDiscovery=true;
  const cancelDrag=()=>{
    if(!draggingPin||!pending.discovery)return;
    draggingPin=false;
    discoveryMarker.setLngLat([pending.discovery.lng,pending.discovery.lat]);
    map.getSource('discovery-radius').setData(radiusFeature(pending.discovery));positionEditor();
    send({type:'pinDragCancelled',id:p.id});
  };
  el.addEventListener('pointercancel',cancelDrag);el.addEventListener('touchcancel',cancelDrag);
  discoveryMarker.on('dragstart',()=>{draggingPin=true;send({type:'pinDragStart',id:p.id})});
  discoveryMarker.on('drag',()=>{const c=discoveryMarker.getLngLat();map.getSource('discovery-radius').setData(radiusFeature({...pending.discovery,lng:c.lng,lat:c.lat}));positionEditor()});
  discoveryMarker.on('dragend',()=>{if(!draggingPin)return;draggingPin=false;revealDiscovery=true;const c=discoveryMarker.getLngLat();send({type:'pinMove',id:p.id,latitude:c.lat,longitude:c.lng})});
 }
 if(!draggingPin)discoveryMarker.setLngLat([p.lng,p.lat]);
 if(revealDiscovery&&!draggingPin){
  revealDiscovery=false;
  const screen=map.project(discoveryMarker.getLngLat()), usableBottom=map.getContainer().clientHeight-(pending.bottomInset||110)-44;
  if(screen.y>usableBottom||screen.y<100)map.panBy([0,screen.y-(100+usableBottom)/2],{duration:0});
 }
 if(document.activeElement!==radius)radius.value=Math.log(p.radiusMiles/0.25)/Math.log(16);
 radiusValue.textContent=Number(p.radiusMiles.toPrecision(2))+' mi';radius.setAttribute('aria-valuetext',radiusValue.textContent);
 map.getSource('discovery-radius').setData(radiusFeature(p));positionEditor();
}
window.renderHermi=data=>{pending=data;if(!loaded)return;
 const signature=JSON.stringify([data.places,data.social]);
 if(signature!==placeSignature){
  placeSignature=signature;markers.forEach(m=>m.remove());markers=[];
  for(const p of data.places||[]){const el=pin(p.color,p.name,p.rows);el.onclick=e=>{e.stopPropagation();send({type:'place',id:p.id})};markers.push(new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map))}
  if(data.social){for(const [i,loc]of [[-73.967,40.8085],[-73.9628,40.8056]].entries()){const el=document.createElement('div');el.className='friend';el.textContent=i?'B':'A';el.setAttribute('aria-label','Sample friend check-in');markers.push(new maplibregl.Marker({element:el}).setLngLat(loc).addTo(map))}}
 }
 renderDiscovery();
 const coords=[[-73.9699,40.8067],[-73.9682,40.8074],[-73.9655,40.8085],[-73.9641,40.8066],[-73.9624,40.8073]];
 map.getSource('adventure').setData(data.adventure?{type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}}]}:empty);
 document.querySelector('.notice').textContent=data.adventure?'SAMPLE ROUTE · NOT RECORDED GPS':'SAMPLE PLACES · REAL MAP';
};
window.commandHermi=c=>{
 if(!map)return;
 if(c.action==='recenter')map.jumpTo({center:[-73.965,40.8075],zoom:15.1});
 else if(c.action==='in')map.zoomIn({duration:0});
 else if(c.action==='out')map.zoomOut({duration:0});
 else if(c.action==='drop'){
  if(!loaded||!Number.isFinite(c.x)||!Number.isFinite(c.y)||c.x<0||c.x>1||c.y<0||c.y>1){send({type:'dropRejected',requestID:c.id});return}
  const canvas=map.getCanvas();
  const p=map.unproject([c.x*canvas.clientWidth,c.y*canvas.clientHeight]);
  send({type:'drop',requestID:c.id,latitude:p.lat,longitude:p.lng});
 }
};
</script></body></html>
