<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"><style>html,body,#map{margin:0;width:100%;height:100%;background:#e9eedc}.maplibregl-canvas{image-rendering:pixelated}.maplibregl-ctrl-attrib{font:9px system-ui}.pin{border:3px solid white;border-radius:9px;background:#447f65;color:white;width:34px;height:34px;font:bold 14px system-ui;box-shadow:0 3px 0 #243c3720;cursor:pointer}.maplibregl-ctrl-bottom-right{bottom:205px}#error{position:absolute;top:45%;left:12%;right:12%;padding:20px;background:#f8faf3;font:14px system-ui;border-radius:20px;color:#243c37;display:none}</style></head><body><div id="map"></div><div id="error">The map needs a connection. Your plans are still available.</div><script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script><script>
const send=v=>window.webkit?.messageHandlers.cairn.postMessage(v);let map,markers=[],pending;
function fail(){document.getElementById('error').style.display='block';send({type:'error'})}
try{map=new maplibregl.Map({container:'map',style:{version:8,sources:{world:{type:'vector',url:'https://tiles.openfreemap.org/planet'}},layers:[{id:'land',type:'background',paint:{'background-color':'#e9eedc'}},{id:'parks',type:'fill',source:'world','source-layer':'landcover',paint:{'fill-color':'#b3cc8d'}},{id:'water',type:'fill',source:'world','source-layer':'water',paint:{'fill-color':'#86bac7'}},{id:'buildings',type:'fill',source:'world','source-layer':'building',paint:{'fill-color':'#d5dcc5'}},{id:'roads',type:'line',source:'world','source-layer':'transportation',paint:{'line-color':'#f8faf3','line-width':['interpolate',['linear'],['zoom'],11,1,17,8]}}]},center:[-73.9636,40.8075],zoom:15,pixelRatio:0.5,minZoom:10.5,maxZoom:18,maxBounds:[[-74.26,40.49],[-73.7,40.92]],attributionControl:true});
map.addControl(new maplibregl.AttributionControl({customAttribution:'© OpenFreeMap · © OpenMapTiles · © OpenStreetMap contributors',compact:true}));
map.on('load',()=>{document.getElementById('error').style.display='none';map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#447f65','line-width':3,'line-dasharray':[1,2]}});if(pending)window.renderCairn(pending);moved()});
map.on('movestart',()=>send({type:'moving'}));map.on('moveend',moved);map.on('click',e=>{if(e.originalEvent.target.classList.contains('pin'))return;send({type:'drop',center:{lat:e.lngLat.lat,lng:e.lngLat.lng}})});map.on('error',fail);
function moved(){const b=map.getBounds(),c=map.getCenter(),a=map.unproject([0,0]),d=map.unproject([map.getCanvas().clientWidth,0]);send({type:'move',bbox:[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(','),center:{lat:c.lat,lng:c.lng},radius:Math.min(1200,Math.max(50,a.distanceTo(d)/3))})}
window.renderCairn=data=>{pending=data;if(!map.isStyleLoaded())return;markers.forEach(m=>m.remove());markers=[];const symbols={food:'✦',nature:'♣',culture:'▥',shopping:'▣',drinks:'☕',sports:'●',music:'♫'};for(const p of data.places||[]){const el=document.createElement('button');el.className='pin';el.textContent=symbols[p.category]||'•';el.setAttribute('aria-label',p.name);el.onclick=e=>{e.stopPropagation();send({type:'place',id:p.id})};markers.push(new maplibregl.Marker({element:el}).setLngLat([p.loc.lng,p.loc.lat]).addTo(map))}const coords=(data.stops||[]).map(s=>s.place?.loc||s.slot?.near).filter(Boolean).map(p=>[p.lng,p.lat]);map.getSource('route')?.setData({type:'FeatureCollection',features:coords.length>1?[{type:'Feature',geometry:{type:'LineString',coordinates:coords},properties:{}}]:[]})};
}catch(e){fail()}
</script></body></html>
